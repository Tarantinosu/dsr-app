  <script>
// ===== GOOGLE SHEETS SDK — shared multi-user via Apps Script =====
(function () {

  // ── Config (local per-browser, e.g. company settings) ────────────────
  var _cfg = {};
  try { var _cs = localStorage.getItem('DSR_config'); if (_cs) _cfg = JSON.parse(_cs); } catch (e) {}

  if (!window.elementSdk) {
    window.elementSdk = {
      config: _cfg,
      init: function (opts) { if (opts && opts.onConfigChange) opts.onConfigChange(_cfg); },
      setConfig: async function (patch) {
        Object.assign(_cfg, patch);
        window.elementSdk.config = _cfg;
        try { localStorage.setItem('DSR_config', JSON.stringify(_cfg)); } catch (e) {}
        return { isOk: true };
      }
    };
  }

  // ── Shared data SDK (Google Sheets) ──────────────────────────────────
  if (!window.dataSdk) {

    // Script URL ที่ทุกคนใช้ร่วมกัน — เจ้าของตั้งค่าครั้งเดียว แชร์ URL ให้เพื่อนวางใน Settings
    var _url = '';
    try { _url = localStorage.getItem('DSR_script_url') || ''; } catch (e) {}

    var _handler = null;
    var _polling = null;

    // ── Banner ──────────────────────────────────────────────────────────
    function _banner(type) {
      var el = document.getElementById('dsr-banner');
      if (!el) { setTimeout(function () { _banner(type); }, 300); return; }
      var txt = {
        none:    '⚙️&nbsp; ยังไม่ได้ตั้งค่า Script URL — ไปที่ <b>ตั้งค่า → การเชื่อมต่อ</b> แล้ววาง URL ของ Apps Script',
        offline: '⚠️&nbsp; เชื่อมต่อ Google Sheets ไม่ได้ — แสดงข้อมูลจาก Cache | จะลองใหม่ใน 30 วิ'
      };
      var _closeBtn = '<button onclick="var b=document.getElementById(\'dsr-banner\');if(b)b.style.display=\'none\';" style="margin-left:auto;background:none;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1;">&times;</button>';
      el.innerHTML = (txt[type] || '') + _closeBtn;
      el.style.display = 'flex';
      var sp = document.getElementById('dsr-banner-sp');
      if (sp) setTimeout(function(){ sp.style.height = el.offsetHeight + 'px'; }, 50);
    }
    function _hideBanner() {
      var el = document.getElementById('dsr-banner');
      if (el) el.style.display = 'none';
      var sp = document.getElementById('dsr-banner-sp');
      if (sp) sp.style.height = '0';
    }

    // ── Sync dot helpers ────────────────────────────────────────────────
    function _dotOn()  { var d=document.getElementById('sync-dot'); if(d) d.style.display='block'; }
    function _dotOff() { var d=document.getElementById('sync-dot'); if(d) d.style.display='none';  }

    // ── Fetch all records from Sheet ────────────────────────────────────
    async function _fetchAll() { _dotOn(); try {
      if (!_url) { _banner('none'); return; }
      try {
        var res = await fetch(_url + '?action=read', { redirect: 'follow' });
        var j   = await res.json();
        if (j.isOk) {
          _hideBanner();
          var recs = j.records || [];
          try { localStorage.setItem('DSR_data', JSON.stringify(recs)); } catch (e) {}
          if (_handler && _handler.onDataChanged) _handler.onDataChanged(recs);
        } else { _banner('offline'); _fromCache(); }
      } catch (e) { _banner('offline'); _fromCache(); } } finally { _dotOff(); }
    }

    function _fromCache() {
      try {
        var s = localStorage.getItem('DSR_data');
        if (s && _handler && _handler.onDataChanged) _handler.onDataChanged(JSON.parse(s));
      } catch (e) {}
    }

    // ── POST helper ─────────────────────────────────────────────────────
    async function _post(body) {
      if (!_url) { _banner('none'); return { isOk: false }; }
      try {
        var res = await fetch(_url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body),
          redirect: 'follow'
        });
        return await res.json();
      } catch (e) { _banner('offline'); return { isOk: false }; }
    }

    // ── Public API ──────────────────────────────────────────────────────
    window.dataSdk = {
      init: async function (handler) {
        _handler = handler;
        _fromCache();                       // แสดง cache ทันที ไม่รอ server
        await _fetchAll();                  // ดึงข้อมูลจริงจาก Sheet
        if (_polling) clearInterval(_polling);
        _polling = setInterval(_fetchAll, 30000);   // รีเฟรชทุก 30 วิ
        return { isOk: true };
      },
      create: async function (record) {
        var r = await _post({ action: 'create', record: record });
        if (r && r.isOk) { record.__backendId = r.__backendId; await _fetchAll(); }
        return r || { isOk: false };
      },
      update: async function (record) {
        var r = await _post({ action: 'update', record: record });
        if (r && r.isOk) await _fetchAll();
        return r || { isOk: false };
      },
      delete: async function (record) {
        var r = await _post({ action: 'delete', id: record.__backendId });
        if (r && r.isOk) await _fetchAll();
        return r || { isOk: false };
      }
    };

    // ── URL management (ใช้จาก Settings) ───────────────────────────────
    window.dsrSetUrl  = function (u) {
      _url = (u || '').trim();
      try { localStorage.setItem('DSR_script_url', _url); } catch (e) {}
      _fetchAll();
    };
    window.dsrGetUrl  = function () { return _url; };
    window.dsrRefresh = function () { _fetchAll(); };
  }

})();
  </script>

// ===== HELPERS =====
function roundHU(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function roundPct(n) { return Math.round(((Number(n) || 0) + Number.EPSILON) * 1000000) / 1000000; }
function fmt(n) { return roundHU(n).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(iso) {
  if (!iso) return '-';
  try { return new Date(iso).toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric' }); }
  catch { return iso; }
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(v) { return String(v == null ? '' : v).replace(/[&<>\"]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]; }); }

function getAssetValue(key) {
  const cfg = window.elementSdk ? window.elementSdk.config : defaultConfig;
  return (cfg && cfg[key]) || localStorage.getItem('DSR_' + key) || '';
}
function assetImg(key, cls, alt) {
  const src = getAssetValue(key);
  return src ? '<img class="' + cls + '" src="' + src + '" alt="' + esc(alt || key) + '">' : '';
}
function readImageAsDataURL(inputId, previewId) {
  return new Promise(function(resolve) {
    const input = document.getElementById(inputId);
    const file = input && input.files && input.files[0];
    if (!file) return resolve(null);
    const reader = new FileReader();
    reader.onload = function() {
      const value = reader.result;
      localStorage.setItem('DSR_' + inputId.replace('set-', '').replace(/-/g, '_') + '_data', value);
      const preview = document.getElementById(previewId);
      if (preview) preview.innerHTML = '<img src="' + value + '" class="max-h-20 max-w-full object-contain">';
      resolve(value);
    };
    reader.onerror = function() { resolve(null); };
    reader.readAsDataURL(file);
  });
}
function previewUpload(inputId, previewId) {
  readImageAsDataURL(inputId, previewId);
}
function badgeClass(s) { return 'badge badge-' + (s || 'draft').toLowerCase(); }
function getYear() { return new Date().getFullYear() + 543; }
function makeSafeWHTName(partnerName, docDate) {
  const rawName = String(partnerName || 'UNKNOWN').trim();
  const parts = rawName.split(/\s+/).filter(Boolean);
  const chosenName = (parts.length > 1 ? parts[parts.length - 1] : rawName) || 'UNKNOWN';
  const safeName = chosenName.toUpperCase().replace(/[^A-Z0-9ก-๙]+/g, '_').replace(/^_+|_+$/g, '') || 'UNKNOWN';
  const d = docDate ? new Date(docDate) : new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return 'WHT_' + safeName + '_' + yyyy + '-' + mm + '-' + dd;
}

function makeSafePartnerReceiptName(partnerName, docDate, instIndex) {
  const rawName = String(partnerName || 'UNKNOWN').trim();
  const parts = rawName.split(/\s+/).filter(Boolean);
  const chosenName = (parts.length > 1 ? parts[parts.length - 1] : rawName) || 'UNKNOWN';
  const safeName = chosenName.toUpperCase().replace(/[^A-Z0-9ก-๙]+/g, '_').replace(/^_+|_+$/g, '') || 'UNKNOWN';
  const d = docDate ? new Date(docDate) : new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return 'PR_' + safeName + '_' + yyyy + '-' + mm + '-' + dd + (instIndex != null ? '_INST' + (instIndex + 1) : '');
}

function canProjectShowDone(projId) {
  const splits = getPartnerSplits(projId);
  return splits.length === 0 || splits.every(function(sp) { return !!sp.partner_paid; });
}
function getProjectDisplayStatus(projectOrId) {
  const project = typeof projectOrId === 'string'
    ? allData.find(function(r) { return r.record_type === 'project' && r.project_id === projectOrId; })
    : projectOrId;
  if (!project) return 'draft';
  const rawStatus = (project.status || 'active').toLowerCase();
  if (!canProjectShowDone(project.project_id)) return 'inprogress';
  if (rawStatus === 'done') return 'done';
  if (rawStatus === 'active') return 'inprogress';
  return rawStatus;
}

    onYes(new Date(dateVal + 'T12:00:00').toISOString());
  };
}

// ===== DATA HELPERS =====
function byType(type) { return allData.filter(r => r.record_type === type); }
function getProfiles(role) { return byType('profile').filter(r => !role || r.role === role); }
function getProjects() { return byType('project'); }
function getQuotation(projId) { return byType('quotation').find(r => r.project_id === projId); }
function getInstallments(projId) {
  return byType('installment').filter(r => r.project_id === projId)
    .sort((a,b) => (a.installment_index||0) - (b.installment_index||0));
}
function getPartnerSplits(projId) { return byType('partner_split').filter(r => r.project_id === projId); }
function getLogs(projId) {
  return byType('log').filter(r => !projId || r.project_id === projId)
    .sort((a,b) => (b.log_timestamp||'').localeCompare(a.log_timestamp||''));
}
function getGeneralExpenses(projId) {
  return byType('project_expense')
    .filter(e => e.project_id === projId && !e.deduct_from_partner)
    .reduce((s, e) => s + (e.expense_amount || 0), 0);
}
function calcProfitBase(projId) {
  const q = getQuotation(projId);
  if (!q) return 0;
  return roundHU((q.subtotal || 0) - (q.client_wht_amount || 0) - getGeneralExpenses(projId));
}

function nextDocNum(prefix) {
  const year = getYear();
  let max = 0;
  allData.forEach(r => {
    [r.doc_number, r.invoice_number, r.receipt_number].forEach(dn => {
      if (dn && dn.startsWith(prefix + year)) {
        const n = parseInt((dn.split('-')[1]) || '0');
        if (n > max) max = n;
      }
    });
  });
  return prefix + year + '-' + String(max + 1).padStart(3, '0');
}

async function addLog(projId, action, detail) {
  await window.dataSdk.create({
    record_type: 'log', project_id: projId || '',
    log_action: action, log_detail: detail,
    log_timestamp: new Date().toISOString()
  });
}

// ===== NAVIGATION =====
function navigate(page, ctx) {
  if (page !== 'project-detail' || ctx !== window._navCtx) {
    _activeTab = 'qt';
  }
  currentPage = page;
  window._navCtx = ctx;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  renderPage();
}

function renderPage() {
  const main = document.getElementById('main-content');
  const ctx = window._navCtx;
  switch(currentPage) {
    case 'dashboard':      renderDashboard(main); break;
    case 'profiles':       renderProfiles(main); break;
    case 'projects':       renderProjects(main); break;
    case 'quotations':     renderQuotations(main); break;
    case 'installments':   renderInstallments(main); break;
    case 'partners':       renderPartners(main); break;
    case 'documents':      renderDocuments(main); break;
    case 'logs':           renderLogs(main); break;
    case 'settings':       renderSettings(main); break;
    case 'project-detail': renderProjectDetail(main, ctx); break;
    default:               renderDashboard(main);
  }
  if (window.lucide) if (window.lucide) lucide.createIcons();
}

function renderDashboard(el) {
  const projects = getProjects();
  const installments = byType('installment');
  const paidInstallments = installments.filter(i => i.status === 'paid');
  const totalRevenue = paidInstallments.reduce((s,i) => s + (i.amount||0), 0);
  const totalAR = installments.filter(i => i.status !== 'paid' && i.status !== 'void').reduce((s,i) => s + (i.amount||0), 0);
  const partnerPaid = byType('partner_split').filter(p => p.partner_paid).reduce((s,p) => s + (p.partner_net_amount||0), 0);
  const totalVAT = paidInstallments.reduce((s,i) => {
    const q = getQuotation(i.project_id);
    if (!q || q.vat_mode !== 'excluded') return s;
    return s + roundHU((i.amount||0) * 0.07 / 1.07);
  }, 0);
  const totalWHT = byType('partner_split').filter(p => p.partner_paid).reduce((s,p) => s + (p.partner_wht_amount||0), 0);
  const totalClientWHT = paidInstallments.reduce((s,i) => {
    const q = getQuotation(i.project_id);
    return q ? s + (q.client_wht_amount||0) : s;
  }, 0);
  const totalExpenses = byType('project_expense').reduce((s,e) => s + (e.expense_amount||0), 0);
  const netProfit = roundHU(totalRevenue - totalClientWHT - totalWHT - partnerPaid - totalVAT - totalExpenses);

  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ label: d.toLocaleDateString('th-TH', {month:'short', year:'2-digit'}), start: d, end: new Date(d.getFullYear(), d.getMonth()+1, 0) });
  }
  const maxMonthly = Math.max(1, ...months.map(m =>
    paidInstallments.filter(i => { const pd = new Date(i.paid_date); return pd >= m.start && pd <= m.end; })
      .reduce((s,i) => s + (i.amount||0), 0)
  ));

  el.innerHTML = '<div class="p-4 md:p-6 fade-in">' +
    '<h1 class="text-xl md:text-2xl font-bold text-white mb-1">แดชบอร์ด</h1>' +
    '<p class="text-slate-400 text-xs md:text-sm mb-4 md:mb-6">ภาพรวมการเงินและโปรเจกต์</p>' +
    '<div class="grid grid-cols-2 lg:grid-cols-4 gap-2 md:gap-4 mb-4 md:mb-6">' +
    '<div class="bg-slate-900 border border-slate-800 rounded-xl p-3 md:p-4"><div class="text-xs text-slate-500 mb-1">รายรับทั้งหมด</div><div class="text-lg md:text-xl font-bold text-emerald-400 mono">' + fmt(totalRevenue) + '</div><div class="text-xs text-slate-500 mt-1">' + paidInstallments.length + ' รายการ</div></div>' +
    '<div class="bg-slate-900 border border-slate-800 rounded-xl p-3 md:p-4"><div class="text-xs text-slate-500 mb-1">ค้างรับ</div><div class="text-lg md:text-xl font-bold text-amber-400 mono">' + fmt(totalAR) + '</div><div class="text-xs text-slate-500 mt-1">' + installments.filter(i => i.status !== 'paid' && i.status !== 'void').length + ' งวด</div></div>' +
    '<div class="bg-slate-900 border border-slate-800 rounded-xl p-3 md:p-4"><div class="text-xs text-slate-500 mb-1">กำไรสุทธิ</div><div class="text-lg md:text-xl font-bold ' + (netProfit >= 0 ? 'text-orange-400' : 'text-red-400') + ' mono">' + fmt(netProfit) + '</div><div class="text-xs text-slate-500 mt-1">หลังหักค่าใช้จ่าย & ภาษี</div></div>' +
    '<div class="bg-slate-900 border border-slate-800 rounded-xl p-3 md:p-4"><div class="text-xs text-slate-500 mb-1">โปรเจกต์</div><div class="text-lg md:text-xl font-bold text-white">' + projects.length + '</div><div class="text-xs text-slate-500 mt-1">' + projects.filter(function(p) { return getProjectDisplayStatus(p) !== 'done'; }).length + ' กำลังดำเนิน</div></div>' +

    '<div class="grid grid-cols-1 lg:grid-cols-3 gap-3 md:gap-4 mb-4 md:mb-6">' +
    '<div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-3 md:p-4">' +
    '<div class="text-xs md:text-sm font-semibold text-white mb-3 md:mb-4">รายรับรายเดือน</div>' +
    '<div class="flex items-end gap-1 md:gap-2 h-32 md:h-40">' +
    months.map(function(m) {
      const val = paidInstallments.filter(function(i) { const pd = new Date(i.paid_date); return pd >= m.start && pd <= m.end; }).reduce(function(s,i) { return s + (i.amount||0); }, 0);
      const pct = (val / maxMonthly) * 100;
      return '<div class="flex-1 flex flex-col items-center gap-1"><div class="text-xs mono text-slate-400 truncate">' + (val > 0 ? fmt(val) : '') + '</div><div class="w-full bg-orange-600/80 rounded-t" style="height:' + Math.max(pct, 2) + '%"></div><div class="text-xs text-slate-500">' + m.label + '</div></div>';

    '</div></div></div>' +
    '<div class="bg-slate-900 border border-slate-800 rounded-xl p-3 md:p-4">' +

      const inst = getInstallments(p.project_id);

async function deleteProfile(id) {
  const rec = allData.find(r => r.__backendId === id);

  showConfirm('ลบ "' + rec.name + '" ?', async function() {

    if (r.isOk) showToast('ลบแล้ว'); else showToast('เกิดข้อผิดพลาด', 'error');
  });
}

async function saveProject(e) {
  e.preventDefault();
  const btn = document.getElementById('proj-submit');
  btn.disabled = true; btn.textContent = 'กำลังสร้าง...';
  const pid = genId();
  const result = await window.dataSdk.create({
    record_type: 'project', project_id: pid,
    project_name: document.getElementById('proj-name').value,
    client_name: document.getElementById('proj-client').value,
    fixed_cost: parseFloat(document.getElementById('proj-cost').value) || 0,
    status: 'active', created_at: new Date().toISOString()
  });
  if (result.isOk) { showToast('สร้างโปรเจกต์สำเร็จ'); await addLog(pid, 'สร้างโปรเจกต์', document.getElementById('proj-name').value); }
  else { showToast('เกิดข้อผิดพลาด', 'error'); btn.disabled = false; btn.textContent = 'สร้าง'; }
}

function safeParseJSON(str) { try { return JSON.parse(str || '[]'); } catch { return []; } }

async function markProjectDone(projId, e) {
  e.stopPropagation();
  const proj = allData.find(r => r.record_type === 'project' && r.project_id === projId);
  if (!proj) return;
  if (!canProjectShowDone(projId)) {
    showToast('โปรเจกต์นี้ยังมีพาร์ทเนอร์ที่ยังไม่ได้รับเงิน สถานะจะยังเป็น inprogress', 'error');
    return;
  }
  showConfirm('ยืนยันว่างาน "' + proj.project_name + '" เสร็จสมบูรณ์แล้ว?\nสถานะจะเปลี่ยนเป็น Done', async function() {
    const updated = Object.assign({}, proj, { status: 'done' });
    const r = await window.dataSdk.update(updated);
    if (r.isOk) { showToast('✅ โปรเจกต์เสร็จสมบูรณ์'); await addLog(projId, 'เปลี่ยนสถานะ', 'Done'); }
    else showToast('เกิดข้อผิดพลาด', 'error');
  });
}

async function deleteProject(projId, e) {
  e.stopPropagation();
  const proj = allData.find(r => r.record_type === 'project' && r.project_id === projId);
  if (!proj) return;
  showConfirm('ลบโปรเจกต์ "' + proj.project_name + '" ?\n\nข้อมูลที่เกี่ยวข้องทั้งหมดจะถูกลบถาวร', async function() {
    const related = allData.filter(r => r.project_id === projId || (r.record_type === 'project' && r.project_id === projId));
    for (const rec of related) { await window.dataSdk.delete(rec); }
    showToast('ลบโปรเจกต์แล้ว');
    navigate('projects');
  });
}

        if (el) el.style.display = t === _activeTab ? '' : 'none';
      });

      const idx = ['qt','inst','split','exp'].indexOf(_activeTab);
      if (tabBtns[idx]) tabBtns[idx].classList.add('active');
    }
  }
}

function showTab(tab, btn) {
  _activeTab = tab;
  ['qt','inst','split','exp'].forEach(function(t) {
    const el = document.getElementById('tab-' + t);
    if (el) el.style.display = t === tab ? '' : 'none';
  });
  btn.parentElement.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}

async function recalcQuotation(q, items) {
  const subtotal = roundHU(items.reduce(function(s,it) { return s + (it.qty||0)*(it.price||0); }, 0));
  let vatAmount, grandTotal, whtAmount;
  if (q.vat_mode === 'excluded') {
    vatAmount = roundHU(subtotal * 0.07);
    whtAmount = roundHU(subtotal * (q.client_wht_rate||0) / 100);
    grandTotal = roundHU(subtotal + vatAmount - whtAmount);
  } else {
    const subNoVat = roundHU(subtotal / 1.07);
    vatAmount = roundHU(subtotal - subNoVat);
    whtAmount = roundHU(subNoVat * (q.client_wht_rate||0) / 100);
    grandTotal = roundHU(subtotal - whtAmount);
  }
  const updated = Object.assign({}, q, { items_json: JSON.stringify(items), subtotal: subtotal, vat_amount: vatAmount, client_wht_rate: (q.client_wht_rate||0), client_wht_amount: whtAmount, grand_total: grandTotal });
  await window.dataSdk.update(updated);
  await cascadeInstallments(q.project_id, grandTotal);
  await cascadePartnerSplits(q.project_id);
}

async function cascadeInstallments(projId, grandTotal) {
  const installments = getInstallments(projId);
  if (installments.length === 0) return;
  let lockedTotal = 0;
  const locked = [], unlocked = [];
  installments.forEach(function(inst) {
    if (inst.status === 'paid' || inst.receipt_number) { locked.push(inst); lockedTotal += inst.amount || 0; }
    else unlocked.push(inst);
  });
  const remaining = roundHU(grandTotal - lockedTotal);
  if (unlocked.length > 0) {
    const totalPct = unlocked.reduce(function(s,u) { return s + (u.split_value||0); }, 0);
    for (let i = 0; i < unlocked.length; i++) {
      const u = unlocked[i];
      let newAmt;
      if (u.split_type === 'percent' && totalPct > 0) newAmt = roundHU(remaining * (u.split_value||0) / totalPct);
      else if (u.split_type === 'fixed') newAmt = roundHU(u.split_value || 0);
      else newAmt = roundHU(remaining / unlocked.length);
      if (i === unlocked.length - 1 && u.split_type === 'percent') {
        const prev = unlocked.slice(0,i).reduce(function(s,uu) { return totalPct > 0 ? s + roundHU(remaining*(uu.split_value||0)/totalPct) : s + roundHU(remaining/unlocked.length); }, 0);
        newAmt = roundHU(remaining - prev);
      }
      await window.dataSdk.update(Object.assign({}, u, { amount: newAmt }));
    }
  }
}

async function cascadePartnerSplits(projId) {
  const q = getQuotation(projId);
  const splits = getPartnerSplits(projId);
  if (!q || splits.length === 0) return;
  const profitBase = calcProfitBase(projId);
  for (const sp of splits) {
    if (sp.partner_paid) continue;
    let partnerAmt = sp.partner_share_type === 'percent'
      ? roundHU(profitBase * (sp.partner_share_value||0) / 100)
      : roundHU(sp.partner_share_value || 0);
    const whtRate = sp.partner_wht_rate || 3;
    const whtAmt = roundHU(partnerAmt * whtRate / 100);
    await window.dataSdk.update(Object.assign({}, sp, { partner_amount: partnerAmt, partner_wht_amount: whtAmt, partner_net_amount: roundHU(partnerAmt - whtAmt) }));
  }
}

async function addPartnerToPie(projId, profitBase) {
  const sel = document.getElementById('new-partner-sel-' + projId);
  if (!sel || !sel.value) { showToast('เลือกพาร์ทเนอร์ก่อน', 'error'); return; }
  const partnerName = sel.value;
  const whtRate = parseFloat(sel.options[sel.selectedIndex].dataset.wht) || 3;
  const splits = getPartnerSplits(projId);
  const usedPct = splits.reduce(function(s,sp) { return s + (sp.partner_share_value||0); }, 0);
  const newPct = Math.max(0, roundHU(100 - usedPct));
  const partnerAmt = roundHU(profitBase * newPct / 100);
  const whtAmt = roundHU(partnerAmt * whtRate / 100);
  const result = await window.dataSdk.create({
    record_type: 'partner_split', project_id: projId,
    partner_name: partnerName, partner_share_type: 'percent', partner_share_value: newPct,
    partner_amount: partnerAmt, partner_wht_rate: whtRate,
    partner_wht_amount: whtAmt, partner_net_amount: roundHU(partnerAmt - whtAmt),
    share_locked: false, partner_paid: false, created_at: new Date().toISOString()
  });
  if (result.isOk) { showToast('เพิ่ม ' + partnerName + ' (' + newPct + '%)'); await addLog(projId, 'เพิ่มพาร์ทเนอร์', partnerName + ' ' + newPct + '%'); }
}

function parseMoneyInput(v) {
  return parseFloat(String(v == null ? '' : v).replace(/,/g, '').trim()) || 0;
}

async function onAllocGrossInput(splitId, projId, profitBase, grossVal) {
  // User types gross partner share before WHT, e.g. 20,000 -> WHT 3% = 600, net = 19,400
  const gross = parseMoneyInput(grossVal);
  if (profitBase <= 0) return;
  const newPct = roundPct(gross / profitBase * 100);
  await _applyAllocChange(splitId, projId, profitBase, newPct);
}

function onAllocSlideDraft(splitId, profitBase, whtRate, val) {
  const pct = Math.max(0, Math.min(100, roundPct(parseFloat(val) || 0)));
  const pctEl = document.getElementById('alloc-pct-' + splitId);
  if (pctEl && !pctEl.dataset.editing) pctEl.value = pct;
  const grossEl = document.getElementById('alloc-gross-' + splitId);
  if (grossEl && document.activeElement !== grossEl) {
    const partnerAmt = roundHU(profitBase * pct / 100);
    grossEl.value = fmt(partnerAmt);
  }
}

async function onAllocSlide(splitId, projId, profitBase, val) {
  await _applyAllocChange(splitId, projId, profitBase, parseFloat(val)||0);
}
async function onAllocInput(splitId, projId, profitBase, val) {
  await _applyAllocChange(splitId, projId, profitBase, parseFloat(val)||0);
}

async function _applyAllocChange(splitId, projId, profitBase, newPct) {
  newPct = Math.max(0, Math.min(100, roundPct(newPct)));
  const splits = getPartnerSplits(projId);
  const thisSp = splits.find(s => s.__backendId === splitId);
  if (!thisSp) return;
  const lockedTotal = splits.filter(s => s.__backendId !== splitId && s.share_locked).reduce(function(sum,s) { return sum + (s.partner_share_value||0); }, 0);
  const maxAllowed = roundPct(100 - lockedTotal);
  if (newPct > maxAllowed) newPct = maxAllowed;
  const unlocked = splits.filter(s => s.__backendId !== splitId && !s.share_locked);
  const remaining = roundPct(maxAllowed - newPct);
  await _saveSplitPct(thisSp, newPct, profitBase);
  if (unlocked.length > 0) {
    const totalPct = unlocked.reduce(function(sum,s) { return sum + (s.partner_share_value||0); }, 0);
    for (let i = 0; i < unlocked.length; i++) {
      let newU = totalPct > 0 ? roundPct(remaining * (unlocked[i].partner_share_value||0) / totalPct) : roundPct(remaining / unlocked.length);
      if (i === unlocked.length - 1) {
        const prev = unlocked.slice(0,i).reduce(function(s,uu) { return s + (totalPct > 0 ? roundPct(remaining*(uu.partner_share_value||0)/totalPct) : roundPct(remaining/unlocked.length)); }, 0);
        newU = roundPct(remaining - prev);
      }
      if (newU < 0) newU = 0;
      await _saveSplitPct(unlocked[i], newU, profitBase);
    }
  }
}

async function _saveSplitPct(sp, pct, profitBase) {
  const partnerAmt = roundHU(profitBase * pct / 100);
  const whtRate = sp.partner_wht_rate || 3;
  const whtAmt = roundHU(partnerAmt * whtRate / 100);
  await window.dataSdk.update(Object.assign({}, sp, {
    partner_share_value: roundPct(pct), partner_amount: partnerAmt,
    partner_wht_amount: whtAmt, partner_net_amount: roundHU(partnerAmt - whtAmt)
  }));
}

async function toggleAllocLock(splitId, projId, profitBase) {
  const sp = allData.find(r => r.__backendId === splitId);
  if (!sp) return;
  await window.dataSdk.update(Object.assign({}, sp, { share_locked: !sp.share_locked }));
  showToast(sp.share_locked ? 'ปลดล็อคแล้ว' : 'ล็อคแล้ว');
}

async function removeSplitFromPie(splitId, projId, profitBase) {
  const sp = allData.find(r => r.__backendId === splitId);
  if (!sp) return;
  showConfirm('ลบ ' + sp.partner_name + ' ออกจากการแบ่งกำไร?', async function() {
    await window.dataSdk.delete(sp);
    showToast('ลบแล้ว');
    await addLog(projId, 'ลบพาร์ทเนอร์', sp.partner_name);
  });
}

// ===== PARTNER INSTALLMENTS =====
function getPartnerInsts(splitId) {
  return byType('partner_installment').filter(r => r.split_id === splitId)
    .sort((a,b) => (a.inst_index||0) - (b.inst_index||0));
}

function clearPartnerInstForm(splitId) {
  const el = document.getElementById('pinst-form-' + splitId);
  if (el) el.innerHTML = '';
}

function showPartnerInstForm(splitId) {
  const sp = allData.find(r => r.__backendId === splitId);
  if (!sp) return;
  const expenses = byType('project_expense').filter(e => e.partner_split_id === splitId && e.deduct_from_partner);
  const totalExp = expenses.reduce((s,e) => s + (e.expense_amount||0), 0);
  const grossTotal = roundHU((sp.partner_amount||0) - totalExp);
  const whtRate = sp.partner_wht_rate || 3;
  const existInsts = getPartnerInsts(splitId);
  const nextInstIndex = existInsts.length ? Math.max.apply(null, existInsts.map(function(i) { return i.inst_index || 0; })) + 1 : 0;
  const nextInstNo = nextInstIndex + 1;
  const paidTotal = existInsts.filter(i => i.paid).reduce((s,i) => s + (i.amount||0), 0);
  const remaining = roundHU(grossTotal - paidTotal);

  const formArea = document.getElementById('pinst-form-' + splitId);
  if (!formArea) return;
  formArea.innerHTML = `<div class="mt-3 p-3 bg-slate-900 border border-slate-700 rounded-lg fade-in">
    <div class="text-xs text-slate-400 mb-2">เพิ่มงวดการจ่าย (ยอดก่อนหัก WHT คงเหลือ: <span class="mono text-white">${fmt(remaining)}</span> บาท)</div>
    <div class="grid grid-cols-1 md:grid-cols-6 gap-2 items-end">
      <div><div class="text-[11px] text-slate-500 mb-1">งวดอัตโนมัติ</div><input id="pinst-no-${splitId}" type="text" value="งวดที่ ${nextInstNo}" readonly class="w-full px-2 py-1.5 bg-slate-800 border border-slate-700 rounded text-xs text-white text-center font-medium"></div>
      <div><div class="text-[11px] text-slate-500 mb-1">วิธีแบ่ง</div><select id="pinst-mode-${splitId}" class="w-full px-2 py-1.5 bg-slate-800 border border-slate-700 rounded text-xs text-white" onchange="updatePartnerInstCalc('${splitId}', ${grossTotal}, ${whtRate})"><option value="amount">จำนวนเงิน</option><option value="percent">เปอร์เซ็นต์ %</option></select></div>
      <div><div class="text-[11px] text-slate-500 mb-1">จำนวนเงิน</div><input id="pinst-amt-${splitId}" type="text" inputmode="decimal" placeholder="จำนวนเงิน" class="w-full px-2 py-1.5 bg-slate-800 border border-slate-700 rounded text-xs text-white mono" oninput="updatePartnerInstCalc('${splitId}', ${grossTotal}, ${whtRate})"></div>
      <div><div class="text-[11px] text-slate-500 mb-1">เปอร์เซ็นต์</div><input id="pinst-pct-${splitId}" type="number" min="0" max="100" step="0.0001" placeholder="%" class="w-full px-2 py-1.5 bg-slate-800 border border-slate-700 rounded text-xs text-white mono" oninput="updatePartnerInstCalc('${splitId}', ${grossTotal}, ${whtRate})"></div>
      <div><div class="text-[11px] text-slate-500 mb-1">หมายเหตุ</div><input id="pinst-note-${splitId}" type="text" placeholder="หมายเหตุ" class="w-full px-2 py-1.5 bg-slate-800 border border-slate-700 rounded text-xs text-white"></div>
      <div class="flex gap-2"><button class="px-3 py-1.5 bg-purple-600 text-white rounded text-xs h-[34px] flex-1" onclick="savePartnerInst('${splitId}')">เพิ่ม</button><button class="px-3 py-1.5 bg-slate-700 text-white rounded text-xs h-[34px] flex-1" onclick="clearPartnerInstForm('${splitId}')">ยกเลิก</button></div>
    </div>
    <div id="pinst-calc-${splitId}" class="mt-2 text-xs text-slate-500">เลือกจำนวนเงินหรือเปอร์เซ็นต์ ระบบจะคำนวณอีกช่องให้อัตโนมัติ</div>
  </div>`;
}

function updatePartnerInstCalc(splitId, grossTotal, whtRate) {
  const modeEl = document.getElementById('pinst-mode-' + splitId);
  const amtEl = document.getElementById('pinst-amt-' + splitId);
  const pctEl = document.getElementById('pinst-pct-' + splitId);
  const calcEl = document.getElementById('pinst-calc-' + splitId);
  if (!modeEl || !amtEl || !pctEl) return;
  const mode = modeEl.value;
  let amount = parseMoneyInput(amtEl.value);
  let pct = parseFloat(pctEl.value) || 0;
  if (mode === 'percent') {
    pct = Math.max(0, Math.min(100, pct));
    amount = roundHU((grossTotal || 0) * pct / 100);
    if (document.activeElement !== amtEl) amtEl.value = amount ? fmt(amount) : '';
  } else {
    amount = Math.max(0, amount);
    pct = grossTotal > 0 ? (amount / grossTotal * 100) : 0;
    if (document.activeElement !== pctEl) pctEl.value = pct ? Number(pct).toFixed(4).replace(/0+$/,'').replace(/\.$/,'') : '';
  }
  if (calcEl) calcEl.innerHTML = 'คิดเป็น <span class="mono text-white">' + (pct ? Number(pct).toFixed(4).replace(/0+$/,'').replace(/\.$/,'0') : '0') + '%</span> = ก่อนหัก <span class="mono text-white">' + fmt(amount) + '</span> บาท · WHT <span class="mono text-amber-400">' + fmt(roundHU(amount * ((whtRate || 3) / 100))) + '</span> · สุทธิ <span class="mono text-emerald-400">' + fmt(roundHU(amount - roundHU(amount * ((whtRate || 3) / 100)))) + '</span>';
}

async function savePartnerInst(splitId) {
  const modeEl = document.getElementById('pinst-mode-' + splitId);
  const amtEl = document.getElementById('pinst-amt-' + splitId);
  const pctEl = document.getElementById('pinst-pct-' + splitId);
  const noteEl = document.getElementById('pinst-note-' + splitId);
  const sp = allData.find(r => r.__backendId === splitId);
  if (!sp) return;
  const expenses = byType('project_expense').filter(e => e.partner_split_id === splitId && e.deduct_from_partner);
  const totalExp = expenses.reduce((s,e) => s + (e.expense_amount||0), 0);
  const grossTotal = roundHU((sp.partner_amount||0) - totalExp);
  const whtRate = sp.partner_wht_rate || 3;
  const mode = modeEl ? modeEl.value : 'amount';
  let percentValue = parseFloat(pctEl ? pctEl.value : '') || 0;
  let amt = parseMoneyInput(amtEl ? amtEl.value : '0');
  if (mode === 'percent') {
    percentValue = Math.max(0, Math.min(100, percentValue));
    amt = roundHU(grossTotal * percentValue / 100);
  } else {
    percentValue = grossTotal > 0 ? (amt / grossTotal * 100) : 0;
  }
  if (amt <= 0) { showToast('ระบุจำนวนเงินหรือเปอร์เซ็นต์', 'error'); return; }
  const existInsts = getPartnerInsts(splitId);
  const nextInstIndex = existInsts.length ? Math.max.apply(null, existInsts.map(function(i) { return i.inst_index || 0; })) + 1 : 0;
  await window.dataSdk.create({
    record_type: 'partner_installment',
    split_id: splitId,
    project_id: sp.project_id,
    inst_index: nextInstIndex,
    inst_mode: mode,
    percent_value: percentValue,
    amount: amt,
    wht_rate: whtRate,
    wht_amount: roundHU(amt * whtRate / 100),
    net_amount: roundHU(amt - roundHU(amt * whtRate / 100)),
    note: noteEl ? (noteEl.value || '') : '',
    paid: false,
    created_at: new Date().toISOString()
  });
  showToast('เพิ่มงวดสำเร็จ');
  await addLog(sp.project_id, 'เพิ่มงวดจ่ายพาร์ทเนอร์', sp.partner_name + ' งวด ' + (nextInstIndex + 1) + ' จำนวน ' + fmt(amt) + ' บาท' + (mode === 'percent' ? ' (' + Number(percentValue).toFixed(2).replace(/\.00$/,'') + '%)' : ''));
}

async function payPartnerInst(instId) {
  const inst = allData.find(r => r.__backendId === instId);
  if (!inst) return;
  const sp = allData.find(r => r.__backendId === inst.split_id);
  const instWhtRate = inst.wht_rate || (sp ? (sp.partner_wht_rate || 3) : 3);
  const instWhtAmount = roundHU((inst.amount || 0) * instWhtRate / 100);
  const instNetAmount = roundHU((inst.amount || 0) - instWhtAmount);
  showDateConfirm('จ่ายเงินพาร์ทเนอร์ งวดที่ ' + ((inst.inst_index||0)+1) + '\nยอดก่อนหัก: ' + fmt(inst.amount) + ' บาท\nWHT ' + instWhtRate + '%: ' + fmt(instWhtAmount) + ' บาท\nสุทธิ: ' + fmt(instNetAmount) + ' บาท' + (inst.note ? '\nหมายเหตุ: ' + inst.note : '') + '\n\nเลือกวันที่จ่าย (ย้อนหลัง/ล่วงหน้าได้)', 'ยืนยันจ่าย', 'bg-purple-600 hover:bg-purple-500', async function(dateISO) {
    await window.dataSdk.update(Object.assign({}, inst, { paid: true, paid_date: dateISO, wht_rate: instWhtRate, wht_amount: instWhtAmount, net_amount: instNetAmount }));
    const allInsts = getPartnerInsts(inst.split_id);
    const allPaid = allInsts.every(i => i.__backendId === instId ? true : i.paid);
    if (allPaid && allInsts.length > 0) {
      await window.dataSdk.update(Object.assign({}, sp, { partner_paid: true, partner_paid_date: dateISO }));
    }
    showToast('บันทึกจ่ายงวดสำเร็จ — ออก Partner Receipt อัตโนมัติแล้ว');
    if (sp) await addLog(inst.project_id, 'จ่ายงวดพาร์ทเนอร์', sp.partner_name + ' งวด ' + ((inst.inst_index||0)+1) + ' จำนวน ' + fmt(inst.amount) + ' บาท');
    setTimeout(function() { previewPartnerReceipt('pinst:' + instId); }, 150);
  });
}

async function deletePartnerInst(instId) {
  const inst = allData.find(r => r.__backendId === instId);
  if (!inst || inst.paid) return;
  showConfirm('ลบงวดนี้?', async function() {
    await window.dataSdk.delete(inst);
    showToast('ลบแล้ว');
  });
}

async function disbursePartner(id) {
  const sp = allData.find(r => r.__backendId === id);
  if (!sp) return;
  const expenses = byType('project_expense').filter(function(e) { return e.partner_split_id === id && e.deduct_from_partner; });

  showDateConfirm('จ่ายเงินให้ ' + sp.partner_name + '\nสุทธิ: ' + fmt(net) + ' บาท\n(WHT ' + (sp.partner_wht_rate||3) + '%: ' + fmt(sp.partner_wht_amount||0) + ' บาท)\n\nเลือกวันที่จ่าย (ย้อนหลัง/ล่วงหน้าได้)', 'ยืนยันจ่าย', 'bg-purple-600 hover:bg-purple-500', async function(dateISO) {
    await window.dataSdk.update(Object.assign({}, sp, { partner_paid: true, partner_paid_date: dateISO }));
    showToast('บันทึกจ่ายเงินสำเร็จ — ออก Partner Receipt อัตโนมัติแล้ว');
    await addLog(sp.project_id, 'จ่ายเงินพาร์ทเนอร์', sp.partner_name + ' จำนวน ' + fmt(net) + ' บาท');
    setTimeout(function() { previewPartnerReceipt(id); }, 150);
  });
}

async function deleteSplitRecord(id) {
  const rec = allData.find(r => r.__backendId === id);
  if (!rec) return;
  showConfirm('ลบพาร์ทเนอร์นี้?', async function() {
    const r = await window.dataSdk.delete(rec);
    if (r.isOk) showToast('ลบแล้ว');
  });
}

// ===== PAGE: DOCUMENTS =====
function renderDocuments(el) {
  const projects = getProjects();
  const selectedClient = window.docClientFilter || '';
  const selectedMonth  = window.docMonthFilter  || '';
  const clients = Array.from(new Set(projects.map(function(p){ return p.client_name||''; }).filter(Boolean))).sort();

  const projectDocs = projects.map(function(p) {
    const q      = getQuotation(p.project_id);
    const inst   = getInstallments(p.project_id);
    const splits = getPartnerSplits(p.project_id);
    const docs   = [];
    if (q) docs.push({ type:'QT',  num:q.doc_number,      date:q.created_at,   projectId:p.project_id });
    inst.forEach(function(i) {
      if (i.invoice_number) docs.push({ type:'INV', num:i.invoice_number, date:i.invoice_date, projectId:p.project_id });
      if (i.receipt_number) docs.push({ type:'REC', num:i.receipt_number, date:i.receipt_date, projectId:p.project_id });
    });
    splits.forEach(function(sp) {
      const paidPInsts = byType('partner_installment').filter(function(pi){ return pi.split_id===sp.__backendId && pi.paid; });
      if (paidPInsts.length > 0) {
        paidPInsts.forEach(function(pi) {
          docs.push({ type:'WHT', num:makeSafeWHTName(sp.partner_name,pi.paid_date)+'_INST'+((pi.inst_index||0)+1), date:pi.paid_date, splitId:'pinst:'+pi.__backendId, projectId:p.project_id });
          docs.push({ type:'PR',  num:makeSafePartnerReceiptName(sp.partner_name,pi.paid_date,(pi.inst_index||0)),  date:pi.paid_date, splitId:'pinst:'+pi.__backendId, projectId:p.project_id });
        });
      } else if (sp.partner_paid) {
        docs.push({ type:'WHT', num:makeSafeWHTName(sp.partner_name,sp.partner_paid_date),           date:sp.partner_paid_date, splitId:sp.__backendId, projectId:p.project_id });
        docs.push({ type:'PR',  num:makeSafePartnerReceiptName(sp.partner_name,sp.partner_paid_date,null), date:sp.partner_paid_date, splitId:sp.__backendId, projectId:p.project_id });
      }
    });
    // เอกสารภายนอกที่อัปโหลดเอง
    byType('external_doc').filter(function(d){ return d.project_id===p.project_id; }).forEach(function(d) {
      docs.push({ type:'EXT', num:d.ext_doc_name||'เอกสาร', date:d.ext_doc_date, projectId:p.project_id, extId:d.__backendId, extData:d.ext_doc_data, extFileType:d.ext_doc_file_type });
    });
    return { project:p, docs:docs };
  });

  const monthSet = new Set();
  projectDocs.forEach(function(g){ g.docs.forEach(function(d){ if(d.date){ const dt=new Date(d.date); if(!isNaN(dt.getTime())) monthSet.add(dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')); } }); });
  const months = Array.from(monthSet).sort().reverse();
  function monthLabel(v){ if(!v) return 'ทุกเดือน'; const parts=v.split('-'); const names=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.']; return names[parseInt(parts[1],10)-1]+' '+(parseInt(parts[0],10)+543); }
  function docMonth(d){ if(!d.date) return ''; const dt=new Date(d.date); if(isNaN(dt.getTime())) return ''; return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); }

  const filteredGroups = projectDocs.map(function(g){
    let docs=g.docs;
    if(selectedMonth) docs=docs.filter(function(d){ return docMonth(d)===selectedMonth; });
    return { project:g.project, docs:docs };
  }).filter(function(g){
    if(selectedClient && g.project.client_name!==selectedClient) return false;
    return g.docs.length>0 || (!selectedMonth&&!selectedClient);
  });
  const allFilteredDocs = filteredGroups.reduce(function(arr,g){ return arr.concat(g.docs); },[]);
  const partnerReceiptDocs = allFilteredDocs.filter(function(d){ return d.type==='PR'; });
  const whtDocs            = allFilteredDocs.filter(function(d){ return d.type==='WHT'; });
  const clientReceiptDocs  = allFilteredDocs.filter(function(d){ return d.type==='REC'; });
  const extDocs            = allFilteredDocs.filter(function(d){ return d.type==='EXT'; });

  el.innerHTML = '<div class="p-6 fade-in"><div class="flex items-center justify-between mb-1"><h1 class="text-2xl font-bold text-white">เอกสาร & พิมพ์</h1></div><p class="text-slate-400 text-sm mb-4">เลือกดูเอกสารตามลูกค้า หรือกรองตามรายเดือน</p>' +
    '<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">' +
      '<div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><div class="text-xs text-slate-500 mb-1">Partner Receipt</div><div class="mono text-2xl text-sky-400 font-bold">'+partnerReceiptDocs.length+'</div></div>' +
      '<div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><div class="text-xs text-slate-500 mb-1">Partner WHT</div><div class="mono text-2xl text-red-400 font-bold">'+whtDocs.length+'</div></div>' +
      '<div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><div class="text-xs text-slate-500 mb-1">Client Receipt</div><div class="mono text-2xl text-emerald-400 font-bold">'+clientReceiptDocs.length+'</div></div>' +
      '<div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><div class="text-xs text-slate-500 mb-1">เอกสารภายนอก</div><div class="mono text-2xl text-purple-400 font-bold">'+extDocs.length+'</div></div>' +
    '</div>' +
    '<div class="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-5"><div class="grid md:grid-cols-3 gap-3 items-end">' +
      '<div><label class="text-xs text-slate-400">ลูกค้า</label><select class="w-full mt-1 px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white" onchange="window.docClientFilter=this.value; renderDocuments(document.getElementById(\'main-content\'))">' +
        '<option value="">ทุกลูกค้า</option>' + clients.map(function(c){ return '<option value="'+esc(c)+'" '+(selectedClient===c?'selected':'')+'>'+esc(c)+'</option>'; }).join('') + '</select></div>' +
      '<div><label class="text-xs text-slate-400">เดือน</label><select class="w-full mt-1 px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white" onchange="window.docMonthFilter=this.value; renderDocuments(document.getElementById(\'main-content\'))">' +
        '<option value="">ทุกเดือน</option>' + months.map(function(m){ return '<option value="'+m+'" '+(selectedMonth===m?'selected':'')+'>'+monthLabel(m)+'</option>'; }).join('') + '</select></div>' +
      '<div class="flex gap-2"><button type="button" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm" onclick="window.docClientFilter=\'\';window.docMonthFilter=\'\';renderDocuments(document.getElementById(\'main-content\'))">ล้างตัวกรอง</button>' +
      '<div class="text-xs text-slate-500 flex items-center">พบ ' + filteredGroups.reduce(function(s,g){ return s+g.docs.length; },0) + ' เอกสาร</div></div></div></div>' +
    '<div class="space-y-3">' +
    (projects.length===0 ? '<p class="text-slate-500 text-sm text-center py-8">ยังไม่มีโปรเจกต์</p>' :
      (filteredGroups.length===0 ? '<p class="text-slate-500 text-sm text-center py-8">ไม่พบเอกสารตามตัวกรองนี้</p>' :
      filteredGroups.map(function(group) {
        const p    = group.project;
        const docs = group.docs;
        return '<div class="bg-slate-900 border border-slate-800 rounded-xl p-4">' +
          '<div class="flex items-center justify-between gap-3 mb-3">' +
            '<div><div class="text-sm font-semibold text-white">'+esc(p.project_name||'-')+'</div>' +
            '<div class="text-xs text-slate-500">ลูกค้า: '+esc(p.client_name||'-')+'</div></div>' +
            '<div class="flex items-center gap-2">' +
              '<span class="text-xs text-slate-500">'+docs.length+' เอกสาร</span>' +
              '<button class="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded-lg text-xs flex items-center gap-1" onclick="showUploadExtDoc(\''+p.project_id+'\')"><i data-lucide="upload" class="w-3 h-3"></i> อัปโหลดเอกสาร</button>' +
            '</div>' +
          '</div>' +
          '<div id="ext-upload-'+p.project_id+'"></div>' +
          (docs.length===0 ? '<p class="text-xs text-slate-500 py-2">ยังไม่มีเอกสาร</p>' :
            '<div class="space-y-1">' + docs.map(function(d) {
              const colorCls  = d.type==='QT'?'text-orange-400':d.type==='INV'?'text-amber-400':d.type==='REC'?'text-emerald-400':d.type==='PR'?'text-sky-400':d.type==='EXT'?'text-purple-400':'text-red-400';
              const typeLabel = d.type==='QT'?'Quotation':d.type==='INV'?'Invoice':d.type==='REC'?'Receipt':d.type==='PR'?'Partner Receipt':d.type==='EXT'?'เอกสารภายนอก':'WHT';
              let btns = '';
              if (d.type==='WHT') {
                btns = '<button type="button" class="text-xs text-orange-400 hover:text-orange-300" onclick="event.stopPropagation();previewWHT(\''+d.splitId+'\')"><i data-lucide="eye" class="w-3 h-3 inline"></i> ดู</button>' +
                       '<button type="button" class="text-xs text-red-400 hover:text-red-300 ml-2" onclick="event.stopPropagation();printWHT(\''+d.splitId+'\')"><i data-lucide="printer" class="w-3 h-3 inline"></i> พิมพ์</button>';
              } else if (d.type==='PR') {
                btns = '<button type="button" class="text-xs text-orange-400 hover:text-orange-300" onclick="return handlePartnerReceiptPreview(event,\''+d.splitId+'\')"><i data-lucide="eye" class="w-3 h-3 inline"></i> ดู</button>' +
                       '<button type="button" class="text-xs text-emerald-400 hover:text-emerald-300 ml-2" onclick="return handlePartnerReceiptPrint(event,\''+d.splitId+'\')"><i data-lucide="printer" class="w-3 h-3 inline"></i> พิมพ์</button>';
              } else if (d.type==='EXT') {
                btns = '<button type="button" class="text-xs text-purple-400 hover:text-purple-300" onclick="event.stopPropagation();viewExtDoc(\''+d.extId+'\')"><i data-lucide="eye" class="w-3 h-3 inline"></i> ดู</button>' +
                       '<button type="button" class="text-xs text-red-400 hover:text-red-300 ml-2" onclick="event.stopPropagation();deleteExtDoc(\''+d.extId+'\')"><i data-lucide="trash-2" class="w-3 h-3 inline"></i> ลบ</button>';
              } else {
                btns = '<button type="button" class="text-xs text-orange-400 hover:text-orange-300" onclick="event.stopPropagation();previewDoc(\''+p.project_id+'\',\''+d.type+'\',\''+d.num+'\')"><i data-lucide="eye" class="w-3 h-3 inline"></i> ดู</button>' +
                       '<button type="button" class="text-xs text-emerald-400 hover:text-emerald-300 ml-2" onclick="event.stopPropagation();printDoc(\''+p.project_id+'\',\''+d.type+'\',\''+d.num+'\')"><i data-lucide="printer" class="w-3 h-3 inline"></i> พิมพ์</button>';
              }
              return '<div class="flex items-center gap-2 p-2 bg-slate-800/50 rounded-lg flex-wrap">' +
                '<span class="text-[10px] px-2 py-0.5 rounded bg-slate-900 text-slate-400 flex-shrink-0">'+typeLabel+'</span>' +
                '<span class="mono text-xs '+colorCls+' flex-shrink-0">'+esc(d.num||'-')+'</span>' +
                '<span class="text-xs text-slate-500 flex-shrink-0">'+fmtDate(d.date)+'</span>' +
                '<div class="flex-1"></div>' + btns + '</div>';
            }).join('') + '</div>') +
          '</div>';
      }).join(''))) + '</div></div>';
  if (window.lucide) lucide.createIcons();
}

function previewExtDoc(input, projId) {
  const file = input.files && input.files[0];
  const preview = document.getElementById('ext-preview-' + projId);
  if (!file || !preview) return;
  if (file.size > 5 * 1024 * 1024) { showToast('ไฟล์ใหญ่เกิน 5MB', 'error'); input.value = ''; preview.innerHTML = ''; return; }
  if (file.type.startsWith('image/')) {
    const url = URL.createObjectURL(file);
    preview.innerHTML = '<img src="'+url+'" class="max-h-32 rounded-lg border border-slate-600">';
  } else {
    preview.innerHTML = '<div class="flex items-center gap-2 text-xs text-slate-400 p-2 bg-slate-900 rounded-lg"><i data-lucide="file-text" class="w-4 h-4 text-purple-400"></i>'+esc(file.name)+'</div>';
    if (window.lucide) lucide.createIcons();
  }
  // auto-fill name if empty
  const nameEl = document.getElementById('ext-name-' + projId);
  if (nameEl && !nameEl.value) nameEl.value = file.name.replace(/\.[^.]+$/, '');
}

async function saveExtDoc(projId) {
  const nameEl = document.getElementById('ext-name-' + projId);
  const dateEl = document.getElementById('ext-date-' + projId);
  const fileEl = document.getElementById('ext-file-' + projId);
  const name   = nameEl ? nameEl.value.trim() : '';
  const date   = dateEl ? dateEl.value : '';
  const file   = fileEl && fileEl.files && fileEl.files[0];
  if (!name) { showToast('กรุณาใส่ชื่อเอกสาร', 'error'); return; }
  if (!file)  { showToast('กรุณาเลือกไฟล์', 'error'); return; }
  const reader = new FileReader();
  reader.onload = async function() {
    const result = await window.dataSdk.create({
      record_type: 'external_doc',
      project_id: projId,
      ext_doc_name: name,
      ext_doc_date: date ? new Date(date + 'T12:00:00').toISOString() : new Date().toISOString(),
      ext_doc_data: reader.result,
      ext_doc_file_type: file.type,
      created_at: new Date().toISOString()
    });
    if (result.isOk) {
      showToast('บันทึกเอกสารสำเร็จ ✓');
      renderDocuments(document.getElementById('main-content'));
    } else { showToast('เกิดข้อผิดพลาด', 'error'); }
  };
  reader.onerror = function() { showToast('อ่านไฟล์ไม่ได้', 'error'); };
  reader.readAsDataURL(file);
}

function viewExtDoc(extId) {
  const rec = allData.find(function(r){ return r.__backendId === extId; });
  if (!rec || !rec.ext_doc_data) return;
  const d = document.getElementById('confirm-dialog');

        '<button class="px-3 py-1.5 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded-lg text-xs" onclick="document.getElementById(\'confirm-dialog\').style.display=\'none\'">ปิด</button>' +

async function deleteExtDoc(extId) {
  const rec = allData.find(function(r){ return r.__backendId === extId; });
  if (!rec) return;
  showConfirm('ลบเอกสาร "' + (rec.ext_doc_name||'เอกสาร') + '" ?', async function() {
    const r = await window.dataSdk.delete(rec);
    if (r.isOk) { showToast('ลบแล้ว'); renderDocuments(document.getElementById('main-content')); }

  });

function previewExpenseDoc(input) {
  const file = input.files && input.files[0];
  const preview = document.getElementById('exp-doc-preview');
  if (!file || !preview) return;
  if (file.size > 4 * 1024 * 1024) {
    showToast('ไฟล์ใหญ่เกิน 4MB กรุณาลดขนาดไฟล์', 'error');
    input.value = ''; preview.innerHTML = ''; return;
  }
  if (file.type.startsWith('image/')) {
    const url = URL.createObjectURL(file);
    preview.innerHTML = '<img src="' + url + '" class="max-h-20 rounded border border-slate-600 mt-1">';
  } else {
    preview.innerHTML = '<div class="flex items-center gap-1 text-xs text-slate-400 mt-1"><i data-lucide="file-text" class="w-3 h-3"></i>' + esc(file.name) + '</div>';
    if (window.lucide) lucide.createIcons();
  }
}

async function readExpenseDoc() {
  return new Promise(function(resolve) {
    const input = document.getElementById('exp-doc-file');
    const file = input && input.files && input.files[0];
    if (!file) return resolve({ data: '', name: '', type: '' });
    const reader = new FileReader();
    reader.onload = function() { resolve({ data: reader.result, name: file.name, type: file.type }); };
    reader.onerror = function() { resolve({ data: '', name: '', type: '' }); };
    reader.readAsDataURL(file);
  });
}

async function saveExpense(e, projId) {

function formatTaxId(id) {
  if (!id || id.length !== 13) return (id||'-');
  // Format: X-XXXX-XXXXX-XX-X
  return id[0]+'-'+id.slice(1,5)+'-'+id.slice(5,10)+'-'+id.slice(10,12)+'-'+id[12];
}

function numToThaiWords(n) {
  const ones = ['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
  const tens = ['','สิบ','ยี่สิบ','สามสิบ','สี่สิบ','ห้าสิบ','หกสิบ','เจ็ดสิบ','แปดสิบ','เก้าสิบ'];
  function below100(n) { return (n<10)?ones[n]:(tens[Math.floor(n/10)]+(n%10===1&&Math.floor(n/10)>1?'เอ็ด':ones[n%10])); }
  function below1000(n) { if(n<100)return below100(n); return ones[Math.floor(n/100)]+'ร้อย'+below100(n%100); }
  function below10000(n) { if(n<1000)return below1000(n); return below100(Math.floor(n/1000))+'พัน'+below1000(n%1000); }
  function below100000(n) { if(n<10000)return below10000(n); return below100(Math.floor(n/10000))+'หมื่น'+below10000(n%10000); }
  function below1000000(n) { if(n<100000)return below100000(n); return below100(Math.floor(n/100000))+'แสน'+below100000(n%100000); }
  function convert(n) { if(n===0)return'ศูนย์'; if(n<1000000)return below1000000(n); return convert(Math.floor(n/1000000))+'ล้าน'+below1000000(n%1000000); }
  const r = Math.round(n*100)/100;
  const baht = Math.floor(r);
  const satang = Math.round((r-baht)*100);
  let w = convert(baht)+'บาท';
  if(satang>0) w += below100(satang)+'สตางค์'; else w += 'ถ้วน';
  return w;
}

function getPartnerPaymentContext(refId) {
  let inst = null;
  let sp = null;
  const ref = String(refId || '');
  const rawRef = ref.indexOf('pinst:') === 0 ? ref.slice(6) : ref;

  function sameId(r, id) {
    return r && id && (String(r.__backendId || '') === String(id) || String(r.id || '') === String(id) || String(r.record_id || '') === String(id));
  }

  if (ref.indexOf('pinst:') === 0) {
    inst = allData.find(function(r) { return r.record_type === 'partner_installment' && sameId(r, rawRef); });
    sp = inst ? allData.find(function(r) { return r.record_type === 'partner_split' && (sameId(r, inst.split_id) || String(r.__backendId || '') === String(inst.split_id || '') || String(r.id || '') === String(inst.split_id || '') || String(r.record_id || '') === String(inst.split_id || '')); }) : null;
  } else {
    // ปกติ ref คือ partner_split id; แต่ fallback ให้รองรับ installment id ตรง ๆ ด้วย
    sp = allData.find(function(r) { return r.record_type === 'partner_split' && sameId(r, rawRef); });
    if (!sp) {
      inst = allData.find(function(r) { return r.record_type === 'partner_installment' && sameId(r, rawRef); });
      sp = inst ? allData.find(function(r) { return r.record_type === 'partner_split' && (sameId(r, inst.split_id) || String(r.__backendId || '') === String(inst.split_id || '') || String(r.id || '') === String(inst.split_id || '') || String(r.record_id || '') === String(inst.split_id || '')); }) : null;
    }
  }

  if (!sp) {
    console.warn('Partner receipt context not found', { refId: refId, rawRef: rawRef });
    return null;
  }

  const projectId = inst ? (inst.project_id || sp.project_id) : sp.project_id;
  const project = allData.find(function(r) { return r.record_type === 'project' && r.project_id === projectId; }) || {};
  const partnerProfile = getProfiles('partner').find(function(p) { return p.name === sp.partner_name; }) || {};
  const whtRate = inst ? (inst.wht_rate || sp.partner_wht_rate || 3) : (sp.partner_wht_rate || 3);
  const gross = inst ? (inst.amount || 0) : (sp.partner_amount || roundHU((sp.partner_net_amount || 0) + (sp.partner_wht_amount || 0)));
  const wht = inst ? (inst.wht_amount || roundHU(gross * whtRate / 100)) : (sp.partner_wht_amount || roundHU(gross * whtRate / 100));
  const net = inst ? (inst.net_amount || roundHU(gross - wht)) : (sp.partner_net_amount || roundHU(gross - wht));
  const paidDate = (inst && inst.paid_date) || sp.partner_paid_date || new Date().toISOString();
  return { inst: inst, sp: sp, project: project, partnerProfile: partnerProfile, gross: gross, wht: wht, net: net, whtRate: whtRate, paidDate: paidDate };
}

function partnerField(profile, keys, fallback) {
  for (let i = 0; i < keys.length; i++) {
    if (profile && profile[keys[i]]) return profile[keys[i]];
  }
  return fallback || '-';
}

function partnerReceiptDocDate(value) {
  if (!value) return '-';
  const d = new Date(value);
  if (isNaN(d.getTime())) return '-';
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
}

function partnerReceiptHtmlText(value) {
  return esc(value || '').replace(/\n/g, '<br>');
}

let _renderPending = false;

function isUserTyping() {
  const active = document.activeElement;
  if (!active) return false;
  const tag = active.tagName;
  if (tag === 'TEXTAREA') return true;
  if (tag === 'SELECT') return true;
  if (tag === 'INPUT') {
    // Allow re-render for checkboxes/radios but block text/number inputs
    const t = active.type || 'text';
    if (t === 'checkbox' || t === 'radio' || t === 'range') return false;
    return true;
  }
  return false;
}

function safeRenderPage() {
  if (isUserTyping()) {
    _renderPending = true;
    return;
  }
  _renderPending = false;
  renderPage();
}

document.addEventListener('focusout', function() {
  if (_renderPending) {
    setTimeout(function() {
      if (!isUserTyping()) {
        _renderPending = false;
        renderPage();
      }
    }, 150);
  }
});

    }
  });
  if (!result.isOk) console.error('Data SDK init failed');
})();

if (window.lucide) if (window.lucide) lucide.createIcons();

// Sync banner spacer height
(function(){
  var b=document.getElementById('dsr-banner');
  var sp=document.getElementById('dsr-banner-sp');
  if(!b||!sp) return;
  new MutationObserver(function(){
    sp.style.height = (b.style.display==='none'?0:b.offsetHeight)+'px';
  }).observe(b,{attributes:true,attributeFilter:['style']});
})();
</script>
